[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-waf-policy-audit"
version = "0.1.0"
description = "Offline auditor for simplified OCI Web Application Firewall policy exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-waf-policy-audit = "oci_waf_policy_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
